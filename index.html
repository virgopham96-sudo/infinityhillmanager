<!doctype html>
<html lang="en">
  <head>
    <script>
      // Safe guard against Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn("Could not redefine window.fetch setter: ", e);
        }
      })();
    </script>
